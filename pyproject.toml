[build-system]
requires = ["setuptools==84.0.0", "setuptools-scm[toml]==10.3.4"]
build-backend = "setuptools.build_meta"

[project]
name = "pydjinni"
authors = [{ name = "jothepro", email = "pydjinni@jothe.pro" }]
dynamic = ["version"]
description = "An opinionated Djinni reimplementation written in Python."
readme = "README.md"
requires-python = ">=3.15"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
]
keywords = ["djinni"]
dependencies = [
    "importlib-metadata>=8.7,<9",
    "click>=8.2,<9",
    "Jinja2>=3.1,<4",
    "pydantic>=2.10.5,<3",
    "pydantic-settings>=2.9.0,<3",
    "rich>=14.1,<15",
    "PyYAML>=6,<7",
    "dotmap>=1.3,<2",
    "tomli-w>=1.2,<2",
    "setuptools>=80",
    "antlr4-python3-runtime==4.13.2",
    "mistune>=3,<4",
    "pygls>=2.1.1,<3",
    "pygments>=2.21,<3",
    "more-itertools>=11.1.0,<12",
    "marko>=2.2.4,<3",
]

[tool.setuptools_scm]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-lsp==1.0.1",
    "coverage==7.6.12",
    "antlr4-tools==0.2.2",
    "pytest-unordered==0.8.0",
    "dirty-equals==0.11",
    "ruff==0.17.1",
]
publish = ["twine==6.1.0", "build==1.0.3"]
doc = [
    "mkdocs-material==9.6.21",
    "mkdocs-click==0.9.0",
    "mike==2.1.3",
    "jsonref==1.1.0",
    "mkdocs-macros-plugin==1.3.7",
    "mkdocs-gen-files==0.5.0",
    "mkdocstrings[python]==0.30.0",
    "setuptools-scm==8.3.1",
]

[tool.pytest]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-vv", "--strict-markers"]
markers = [
    "parser_input: marks tests with the parser fixture to configure the parser IDL input",
]

[project.urls]
Repository = "https://github.com/pydjinni/pydjinni"
Homepage = "https://pydjinni.github.io/pydjinni"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
ignore = ["src/pydjinni/parser/grammar", "**/site-packages"]

[tool.ruff]
preview = true
line-length = 120
target-version = "py315"
extend-exclude = ["src/pydjinni/parser/grammar"]

[tool.ruff.lint]
extend-select = ["TC", "I", "D", "DOC", "D417"]
extend-safe-fixes = ["TC001", "TC002", "TC003"]
ignore = ["D100", "D105"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.per-file-ignores]
"tests/**" = ["D"]

[project.scripts]
pydjinni = "pydjinni.__main__:main"
pydjinni-language-server = "pydjinni_language_server.__main__:main"
pydjinni-init = "pydjinni_init.__main__:main"

[project.entry-points.'pydjinni.generator']
cpp = 'pydjinni.generator.cpp:CppTarget'
java = 'pydjinni.generator.java:JavaTarget'
objc = 'pydjinni.generator.objc:ObjcTarget'
cppcli = 'pydjinni.generator.cppcli:CppCliTarget'
yaml = 'pydjinni.generator.yaml:YamlTarget'
[project.entry-points.'pydjinni.builder']
conan = 'pydjinni.builder.conan:ConanTarget'
[project.entry-points.'pydjinni.packaging']
swiftpackage = 'pydjinni.packaging.swiftpackage:SwiftpackageTarget'
aar = 'pydjinni.packaging.aar:AndroidArchiveTarget'
nuget = 'pydjinni.packaging.nuget:NuGetTarget'
[project.entry-points.'pydjinni.init']
conan-cmake = 'pydjinni_init.templates.conan_cmake:ConanCMakeTarget'
[project.entry-points.'pygments.lexers']
djinni = 'pydjinni_pygments:PyDjinniLexer'
